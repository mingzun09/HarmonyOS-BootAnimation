name: Build module

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Ensure a font for generated artwork
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build default artwork
        run: python build.py

      - name: Validate default module
        run: python tests/validate.py --expect-mode generated

      - name: Build custom-artwork smoke test
        run: python build.py --mode custom

      - name: Validate custom module
        run: python tests/validate.py --expect-mode custom

      - name: Rebuild release artifact
        run: python build.py

      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: harmonyos-bootanimation
          path: |
            artifacts/*.zip
            artifacts/*.gif
            artifacts/*.png
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.gif
            artifacts/*.png
          generate_release_notes: true
